<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Follow a Soldier | Battle of Prairie Grove</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

    --paper:#f5f1e7;
    --paper-dark:#e6decb;

    --ink:#2b2b2b;

    --sage:#5f6755;
    --prairie:#85714a;
    --earth:#72533b;

    --accent:#7a2c1d;

    --border:#cbbfa5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Source Sans 3',sans-serif;
    color:var(--ink);
    min-height:100vh;

    background:
    linear-gradient(
        rgba(245,241,231,.92),
        rgba(245,241,231,.96)
    ),
    url("images/prairie-grove-background.jpg");

    background-size:cover;
    background-position:center;
}

h1,h2,h3{
    font-family:'Libre Baskerville',serif;
}

.hidden{
    display:none !important;
}

/* -------------------------------- */
/* START SCREEN */
/* -------------------------------- */

.start-screen{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;
}

.start-card{

    width:min(950px,100%);
    background:var(--paper);

    border:1px solid var(--border);

    padding:40px;

    box-shadow:0 4px 16px rgba(0,0,0,.08);
}

.main-heading{
    font-size:2.5rem;
    color:var(--earth);
}

.intro-subtitle{
    margin-top:10px;
    color:var(--prairie);
    line-height:1.5;
}

.section-title{

    margin-top:35px;

    text-transform:uppercase;

    letter-spacing:2px;

    font-size:.8rem;

    color:var(--accent);
}

.side-buttons,
.regiment-buttons{

    display:grid;
    gap:15px;
    margin-top:20px;
}

.side-buttons{
    grid-template-columns:1fr 1fr;
}

.regiment-buttons{
    grid-template-columns:1fr 1fr;
}

button{

    border:none;

    background:var(--sage);

    color:white;

    padding:16px;

    font-size:1rem;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    background:var(--accent);
}

/* -------------------------------- */
/* MAIN */
/* -------------------------------- */

.app{
    min-height:100vh;
    display:grid;
    grid-template-columns:380px 1fr;
}

.sidebar{

    background:var(--paper-dark);

    border-right:2px solid var(--border);

    padding:25px;

    overflow:auto;
}

.site-title{

    font-family:'Libre Baskerville',serif;

    font-size:1.75rem;

    color:var(--earth);
}

.site-subtitle{
    margin-top:8px;
    color:var(--prairie);
    line-height:1.5;
}

.unit-panel{

    margin-top:25px;

    padding-top:20px;

    border-top:1px solid var(--border);
}

.label{
    text-transform:uppercase;

    letter-spacing:2px;

    font-size:.75rem;

    color:var(--prairie);
}

#unitSide{
    margin-top:8px;
    font-weight:700;
}

#unitRegiment{
    margin-top:5px;
}

.map-container{
    position:relative;
    aspect-ratio:4 / 3;
    margin-top:25px;
    overflow:hidden;
    border:1px solid var(--border);
    background:var(--paper-dark);
}

.map-container img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.marker{

    width:18px;
    height:18px;

    border-radius:50%;

    border:2px solid white;

    background:var(--accent);

    position:absolute;

    transform:translate(-50%,-50%);

    transition:all 1.5s ease;
}

.route-panel{
    margin-top:25px;
}

.route-stop{

    display:flex;
    gap:10px;

    margin-bottom:14px;

    opacity:.35;
}

.route-stop.active{
    opacity:1;
}

.stop-dot{

    width:10px;
    height:10px;

    margin-top:6px;

    background:var(--accent);

    border-radius:50%;
}

/* -------------------------------- */
/* STORY */
/* -------------------------------- */

.content{

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px;
}

.story-card{

    width:min(930px,100%);

    background:var(--paper);

    border:1px solid var(--border);

    padding:40px;

    box-shadow:0 4px 16px rgba(0,0,0,.08);
}

.scene-date{

    text-transform:uppercase;

    letter-spacing:2px;

    font-size:.8rem;

    color:var(--accent);
}

.scene-title{

    margin-top:12px;

    font-size:2rem;

    color:var(--earth);
}

.scene-text{

    margin-top:20px;

    line-height:1.9;

    font-size:1.08rem;
}

.context-box{

    margin-top:25px;

    background:#efe7d6;

    border-left:5px solid var(--accent);

    padding:18px;
}

.context-title{

    font-weight:700;

    margin-bottom:8px;
}

.choices{

    display:grid;

    gap:12px;

    margin-top:30px;
}

/* -------------------------------- */
/* MOBILE */
/* -------------------------------- */

@media(max-width:900px){

    .app{

        display:flex;
        flex-direction:column;
    }

    .content{
        padding:15px;
    }

    .story-card{
        padding:25px;
    }

    .side-buttons,
    .regiment-buttons{
        grid-template-columns:1fr;
    }

    .scene-title{
        font-size:1.6rem;
    }
}

</style>
</head>
<body>

<!-- ========================================= -->
<!-- START SCREEN -->
<!-- ========================================= -->

<div id="startScreen" class="start-screen">

    <div class="start-card">

        <h1 class="main-heading">
            Battle of Prairie Grove
        </h1>

        <p class="intro-subtitle">
            Follow a Soldier<br>
            December 1862
        </p>

        <div class="section-title">
            Choose a Side
        </div>

        <div class="side-buttons">

            <button onclick="chooseSide('Union')">
                US Army
            </button>

            <button onclick="chooseSide('Confederate')">
                CS Army
            </button>

        </div>

        <div
            id="regiments"
            class="regiment-buttons">
        </div>

    </div>

</div>

<!-- ========================================= -->
<!-- APP -->
<!-- ========================================= -->

<div id="app" class="app hidden">

    <aside class="sidebar">

        <div class="site-title">
            Battle of Prairie Grove
        </div>

        <div class="site-subtitle">
            Follow a Soldier<br>
            December 1862
        </div>

        <div class="unit-panel">

            <div class="label">
                Selected Regiment
            </div>

            <div id="unitSide"></div>
            <div id="unitRegiment"></div>

        </div>

        <div class="map-container">

            <img src="images/prairie-grove-campaign-map.jpg" alt="Campaign map showing the route to Prairie Grove">

            <div id="marker" class="marker"></div>

        </div>

        <div class="route-panel">

            <div class="label">
                Campaign Route
            </div>

            <div id="routeStops"></div>

        </div>

    </aside>

    <main class="content">

        <div class="story-card">

            <div id="sceneDate" class="scene-date"></div>

            <div id="sceneTitle" class="scene-title"></div>

            <div id="sceneText" class="scene-text"></div>

            <div class="context-box">

                <div class="context-title">
                    Historical Context
                </div>

                <div id="contextText"></div>

            </div>

            <div id="choices" class="choices"></div>

        </div>

    </main>

</div>

<script>

/* =================================== */
/* REGIMENTS */
/* =================================== */

const regimentGroups = {

Union:[
"20th Wisconsin Infantry",
"19th Iowa Infantry",
"10th Kansas Infantry",
"1st Indian Home Guard"
],

Confederate:[
"34th Arkansas Infantry",
"22nd Arkansas Infantry",
"10th Missouri Cavalry",
"Blocher's Battery"
]

};

let side = "";
let regiment = "";
let current = 0;
let scenes = [];

const miniGames = [
    "https://pgbsp.github.io/springfield-rifle/",
    "https://pgbsp.github.io/haversack-challenge/",
    "https://pgbsp.github.io/pg-spycraft/"
];

/* =================================== */
/* SIDE SELECTION */
/* =================================== */

function chooseSide(selected){

    if (!Object.prototype.hasOwnProperty.call(regimentGroups, selected)) {
        return;
    }

    side = selected;

    const container =
        document.getElementById("regiments");

    container.innerHTML = "";

    regimentGroups[selected]
    .forEach(reg => {

        const btn =
            document.createElement("button");

        btn.textContent = reg;

        btn.onclick =
            () => startExperience(reg);

        container.appendChild(btn);
    });
}

/* =================================== */
/* STORY FACTORY */
/* =================================== */

function createStory(regiment){

if(
regiment==="20th Wisconsin Infantry" ||
regiment==="19th Iowa Infantry"
){

const veteran =
regiment==="19th Iowa Infantry";

return [

{
date:"December 3, 1862",
location:"Springfield, Missouri",
title:"On the March",
text:veteran
?
"Without much warning, you hear that you are to move south to Arkansas. You gather up as many of your belongings as you can and fall in."
:
"Many soldiers are relatively new to campaigning. As the column leaves Springfield, excitement and uncertainty travel side-by-side.",

context:"After receiving requests for reinforcements from Gen. James Blunt, Gen. Francis Herron ordered his division to march from Springfield, Missouri, toward Fayetteville.",

marker:{left:"60%",top:"30%"},

choices:[
"Fall in with the head of the column",
"Walk alongside the wagon train"
]
},

{
date:"December 5, 1862",
location:"Arkansas Road",
title:"Days on the March",
text:"Cold weather, muddy roads, and long hours make progress difficult. Stories, songs, and conversation help pass the miles.",

context:"For most Civil War soldiers, marching consumed far more time than combat.",

marker:{left:"35%",top:"68%"},

choices:[
"Share news from the road",
"Keep your attention on the march"
]
},

{
date:"December 7, 1862",
location:"Near Prairie Grove",
title:"The Sound of Cannon Fire",
text:"Distant artillery can be heard ahead. Officers encourage the men forward, knowing a major engagement may already be underway.",

context:"Many units hurried toward Prairie Grove after hearing reports of fighting.",

marker:{left:"60%",top:"50%"},

choices:[
"Stay close to your company",
"Watch the countryside as you march"
]
},

{
date:"December 7, 1862",
location:"Prairie Grove",
title:"Arrival",
text:"After days on the road, the regiment finally nears Prairie Grove. The sounds of battle carry across the landscape.",

context:"Some regiments arrived after lengthy marches and entered the campaign already exhausted.",

marker:{left:"85%",top:"30%"},

choices:[
"Await further orders",
"Look toward the ridge ahead"
]
}
];

}

/* Cane Hill */

if(
regiment==="10th Kansas Infantry" ||
regiment==="1st Indian Home Guard"
){

return [

{
date:"December 7, 1862",
location:"Cane Hill",
title:"Orders to Move",
text:
regiment==="1st Indian Home Guard"
?
"Many soldiers reflect on protecting their homes and communities as orders arrive to move toward Prairie Grove."
:
"Veteran soldiers quickly prepare to move north toward the developing situation near Prairie Grove.",

context:"Union units near Cane Hill were called upon to move quickly toward the battlefield.",

marker:{left:"15%",top:"82%"},

choices:[
"Keep pace with the regiment",
"Watch the ridges for movement"
]
},

{
date:"Late Morning",
location:"Road North",
title:"A Rapid March",
text:"The pace quickens. Couriers move between commands while units press northward.",

context:"Communication depended on mounted couriers carrying orders between commanders.",

marker:{left:"40%",top:"65%"},

choices:[
"Stay with your company",
"Listen for news from ahead"
]
},

{
date:"Noon",
location:"Prairie Grove Road",
title:"Approaching the Battlefield",
text:"Artillery reports become easier to hear. The march continues with little time to rest.",

context:"Many soldiers understood the battle only through sounds carried on the wind.",

marker:{left:"62%",top:"48%"},

choices:[
"Focus on the march",
"Study the landscape ahead"
]
},

{
date:"Afternoon",
location:"Prairie Grove",
title:"Arrival",
text:"The regiment reaches the vicinity of Prairie Grove after a determined movement from Cane Hill.",

context:"Speed of movement often influenced where regiments arrived and when they could be committed.",

marker:{left:"82%",top:"30%"},

choices:[
"Remain with your regiment",
"Wait for new instructions"
]
}
];

}

/* Morrow Route */

return [

{
date:"December 7, 1862",
location:"Morrow",
title:"Breaking Camp",
text:
regiment==="Blocher's Battery"
?
"Battery crews spend the morning preparing horses, limbers, guns, and ammunition wagons for movement."
:
regiment==="10th Missouri Cavalry"
?
"Mounted troopers move between units carrying information and observing activity along the roads."
:
regiment==="34th Arkansas Infantry"
?
"Many soldiers know the countryside well and wonder what lies ahead for their home state."
:
"Veteran soldiers quietly begin another difficult winter march.",

context:"Confederate forces moved through the region attempting to concentrate before the battle.",

marker:{left:"82%",top:"20%"},

choices:[
"Listen for news from ahead",
"Focus on the miles ahead"
]
},

{
date:"Midday",
location:"Country Roads",
title:"On the March",
text:"Hours pass as columns continue across the Arkansas countryside.",

context:"Road conditions often determined how quickly entire armies could move.",

marker:{left:"68%",top:"38%"},

choices:[
"Keep step with the column",
"Observe the countryside"
]
},

{
date:"Afternoon",
location:"Approaching Prairie Grove",
title:"Reports from the Front",
text:"Word travels through the marching columns that fighting may already have begun.",

context:"Information was frequently delayed, incomplete, or inaccurate during Civil War campaigns.",

marker:{left:"52%",top:"55%"},

choices:[
"Stay with your comrades",
"Watch the road ahead"
]
},

{
date:"Late Afternoon",
location:"Prairie Grove",
title:"Journey Complete",
text:"After a demanding march, the regiment reaches the area around Prairie Grove.",

context:"Many soldiers arrived tired from travel before facing the realities of battle.",

marker:{left:"30%",top:"72%"},

choices:[
"Await new orders",
"Take in the scene around you"
]
}
];

}

/* =================================== */

function startExperience(selected){

    if (!side || !regimentGroups[side]?.includes(selected)) {
        return;
    }

    regiment = selected;
    current = 0;
    scenes = createStory(regiment);

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("app")
        .classList.remove("hidden");

    document.getElementById("unitSide")
        .textContent = side;

    document.getElementById("unitRegiment")
        .textContent = regiment;

    renderScene();
}

/* =================================== */

function renderRoute(){

    const route =
    document.getElementById("routeStops");

    route.innerHTML = "";

    scenes.forEach((scene,index)=>{

        const stop =
        document.createElement("div");

        stop.className =
        index===current
        ? "route-stop active"
        : "route-stop";

        stop.innerHTML =
        `
        <div class="stop-dot"></div>
        <div>${scene.location}</div>
        `;

        route.appendChild(stop);
    });

}

function renderScene(){

    if (current >= scenes.length) {
        ending();
        return;
    }

    const s = scenes[current];

    document.getElementById("sceneDate")
        .textContent = s.date;

    document.getElementById("sceneTitle")
        .textContent = s.title;

    document.getElementById("sceneText")
        .textContent = s.text;

    document.getElementById("contextText")
        .textContent = s.context;

    const marker =
        document.getElementById("marker");

    marker.style.left = s.marker.left;
    marker.style.top = s.marker.top;

    renderRoute();

    const choices =
        document.getElementById("choices");

    choices.innerHTML = "";

    s.choices.forEach(choice=>{

        const btn =
        document.createElement("button");

        btn.textContent = choice;

        btn.onclick = () => { launchMiniGame(); };

        choices.appendChild(btn);

    });

}

function launchMiniGame() {

    const gameIndex =
        current % miniGames.length;

    sessionStorage.setItem("returnToStory", "true");
    sessionStorage.setItem("currentScene", current + 1);
    sessionStorage.setItem("storySide", side);
    sessionStorage.setItem("storyRegiment", regiment);

    window.location.href =
        miniGames[gameIndex];
}

function checkForReturn() {
    if (sessionStorage.getItem("returnToStory") !== "true") {
        return;
    }

    const savedSide = sessionStorage.getItem("storySide");
    const savedRegiment = sessionStorage.getItem("storyRegiment");

    if (!regimentGroups[savedSide]?.includes(savedRegiment)) {
        sessionStorage.removeItem("returnToStory");
        sessionStorage.removeItem("currentScene");
        sessionStorage.removeItem("storySide");
        sessionStorage.removeItem("storyRegiment");
        return;
    }

    side = savedSide;
    regiment = savedRegiment;
    scenes = createStory(regiment);
    current = Number(sessionStorage.getItem("currentScene")) || 0;
    current = Math.max(0, Math.min(current, scenes.length));

    sessionStorage.removeItem("returnToStory");
    sessionStorage.removeItem("currentScene");
    sessionStorage.removeItem("storySide");
    sessionStorage.removeItem("storyRegiment");

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("unitSide").textContent = side;
    document.getElementById("unitRegiment").textContent = regiment;
    renderScene();
}

window.addEventListener("pageshow", checkForReturn);
function launchBattle() {

    if (
        regiment === "19th Iowa Infantry" ||
        regiment === "20th Wisconsin Infantry"
    ) {

        window.location.href =
            "https://pgbsp.github.io/herron-dilemma/";
    }

    else if (
        regiment === "10th Kansas Infantry" ||
        regiment === "1st Indian Home Guard"
    ) {

        window.location.href =
            "https://pgbsp.github.io/blunt-dilemma/";
    }

    else {

        window.location.href =
            "https://pgbsp.github.io/hindman-dilemma/";
    }
}

/* =================================== */

function ending(){

document.getElementById("sceneDate")
.textContent="Journey Complete";

document.getElementById("sceneTitle")
.textContent="Arrival at Prairie Grove";

document.getElementById("sceneText")
.textContent=
"Your journey to Prairie Grove is complete. Like most Civil War soldiers, much of your experience involved marching, waiting, uncertainty, and following orders. The roads leading to Prairie Grove shaped the battle just as surely as the fighting itself.";

document.getElementById("contextText")
.textContent=
"Campaigns were won and lost through movement, logistics, communication, and endurance long before shots were fired.";

document.getElementById("choices")
.innerHTML=
`
<button onclick="launchBattle()">
Continue to the Battle
</button>

<button onclick="location.reload()">
Select Another Regiment
</button>
`;

}

/* =================================== */
checkForReturn();

</script>

</body>
</html>
